name: Automation ITSchool

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'chose automation suite RegresionSuite, SmokeSuite'
        required: true
        default: SmokeSuite
      browser:
        description: 'chose browser: chrome, edge'
        required: true
        default: chrome

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Run Automation Suite
        run: mvn clean install -Dci_cd=true -Dbrowser=${{ github.event.inputs.browser }} -DsuiteXmlFile=Suites/${{ github.event.inputs.suite }} -PCustomSuite

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Run results
          path: |
            target/chaintest
            target/logs
